trigger:
  batch: true
  branches:
    include:
      - "main"

variables:
- name: BuildPlatform
  value : 'x64'
- name: BuildConfiguration
  value: 'release'
- name: SolutionBaseName
  value: 'SFA.DAS.Payments.EarningEvents'
- name: ArtifactName
  value: 'EarningBridge'
- group: Release Management Resources
- group: RELEASE das-payments-v2-earningevents
# - group: Common - Connection String
# - group: Common -  Storage Account
# - group: DCOL-DST - Environment Key Vault Secrets

resources:
  repositories:
    - repository: self
    - repository: das-platform-building-blocks
      type: github
      name: SkillsFundingAgency/das-platform-building-blocks
      endpoint: SkillsFundingAgency
      ref: refs/heads/master
    - repository: das-platform-automation
      type: github
      name: SkillsFundingAgency/das-platform-automation
      endpoint: SkillsFundingAgency
      ref: refs/heads/master
    - repository: DevOps-Utilities
      type: git
      name: DCT/DevOps-Utilities
      ref: refs/heads/master

stages:
- stage: Build
  jobs:
  - template: pipeline-templates/job/code-build.yml

- template: azure-pipelines-templates/deploy/stage/nuget-publish.yml

- stage: Deploy_DAS
  dependsOn: NuGetPublish
  condition: and(succeeded(), eq(variables['Build.Reason'], 'Manual'))
  displayName: Deploy to DAS
  variables:
  - group: DAS das-payments-v2-earningevents
  jobs:
  - template: pipeline-templates/job/deploy.yml
    parameters:
      ServiceConnection: DCT-VSO
      # ServiceFabricClusterConnection: DCOL-DAS-ServiceFabric-WEU
      SolutionBaseName: ${{ variables.SolutionBaseName }}
      ArtifactName: $(ArtifactName)
      Environment: DAS

- stage: Deploy_DST
  dependsOn: NuGetPublish
  condition: and(succeeded(), eq(variables['Build.Reason'], 'Manual'))
  displayName: Deploy to DST
  variables:
  - group: DST das-payments-v2-earningevents
  jobs:
  - template: pipeline-templates/job/deploy.yml
    parameters:
      ServiceConnection: DCT-VSO
      # ServiceFabricClusterConnection: DCOL-DST-ServiceFabric-WEU
      SolutionBaseName: ${{ variables.SolutionBaseName }}
      ArtifactName: $(ArtifactName)
      Environment: DST

- stage: Deploy_SIT
  dependsOn: NuGetPublish
  condition: and(succeeded(), eq(variables['Build.Reason'], 'Manual'))
  displayName: Deploy to SIT
  variables:
  - group: SIT das-payments-v2-earningevents
  jobs:
  - template: pipeline-templates/job/deploy.yml
    parameters:
      ServiceConnection: DCT-VSO
      # ServiceFabricClusterConnection: DCOL-SIT-ServiceFabric-WEU
      SolutionBaseName: ${{ variables.SolutionBaseName }}
      ArtifactName: $(ArtifactName)
      Environment: SIT

- stage: Deploy_ETE
  dependsOn: NuGetPublish
  condition: and(succeeded(), eq(variables['Build.Reason'], 'Manual'))
  displayName: Deploy to ETE
  variables:
  - group: ETE das-payments-v2-earningevents
  jobs:
  - template: pipeline-templates/job/deploy.yml
    parameters:
      ServiceConnection: DCT-VSO
      # ServiceFabricClusterConnection: DCOL-ETE-ServiceFabric-WEU
      SolutionBaseName: ${{ variables.SolutionBaseName }}
      ArtifactName: $(ArtifactName)
      Environment: ETE

- stage: Deploy_MO
  dependsOn: NuGetPublish
  condition: and(succeeded(), eq(variables['Build.Reason'], 'Manual'))
  displayName: Deploy to MO
  variables:
  - group: MO das-payments-v2-earningevents
  jobs:
  - template: pipeline-templates/job/deploy.yml
    parameters:
      ServiceConnection: DCOL-MO-VSTS
      # ServiceFabricClusterConnection: DCOL-MO-ServiceFabric-WEU
      SolutionBaseName: ${{ variables.SolutionBaseName }}
      ArtifactName: $(ArtifactName)
      Environment: MO

- stage: Deploy_PP
  dependsOn: NuGetPublish
  condition: and(succeeded(), eq(variables['Build.Reason'], 'Manual'))
  displayName: Deploy to PP
  variables:
  - group: PP das-payments-v2-earningevents
  jobs:
  - template: pipeline-templates/job/deploy.yml
    parameters:
      ServiceConnection: DCOLPPVSTS
      # ServiceFabricClusterConnection: DCOL-PP-ServiceFabric-WEU
      SolutionBaseName: ${{ variables.SolutionBaseName }}
      ArtifactName: $(ArtifactName)
      Environment: PP

- stage: Deploy_PD
  dependsOn: NuGetPublish
  condition: and(succeeded(), eq(variables['Build.Reason'], 'Manual'))
  displayName: Deploy to PD
  variables:
  - group: PD das-payments-v2-earningevents
  jobs:
